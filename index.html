<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#26070d">
<title>轉珠妙法・祈福護佑</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#180509}
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#stage{
 position:relative;width:min(100vw,520px);height:100vh;height:100dvh;margin:0 auto;
 overflow:hidden;isolation:isolate;touch-action:none;
 background:radial-gradient(ellipse at 50% 42%,#54202a 0%,#2a0c13 48%,#100509 100%);
}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#rear{z-index:1}
#hand{
 position:absolute;z-index:2;left:50%;top:50%;
 width:100%;height:auto;max-height:100%;object-fit:contain;
 transform:translate(-50%,-50%);pointer-events:none;
 filter:drop-shadow(0 8px 16px #0007);
}
#front{z-index:3}
.hud{position:absolute;z-index:7;top:max(14px,env(safe-area-inset-top));right:16px}
.sound{width:42px;height:42px;border:1px solid #d8b56d;border-radius:50%;color:#f4d99d;background:#300a12dd;font-size:18px;box-shadow:0 0 0 3px #d8b56d18,0 4px 18px #0008;}
.banner{position:absolute;z-index:6;top:max(20px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 100px);padding:10px 18px 11px;border:1px solid #c69b54;border-radius:3px;background:linear-gradient(135deg,#4a0c19eF,#23070eeF);color:#f5d99d;font-family:"Noto Serif TC","Songti TC",serif;font-size:clamp(15px,4.1vw,19px);font-weight:600;letter-spacing:.16em;text-align:center;white-space:nowrap;text-shadow:0 1px 5px #7c321d;box-shadow:0 5px 22px #0007,inset 0 0 0 2px #d9b66a18}
.banner:before,.banner:after{content:"✦";color:#d8b56d;font-size:10px;position:absolute;top:50%;transform:translateY(-50%)}
.banner:before{left:6px}.banner:after{right:6px}
.counterPanel{position:absolute;z-index:7;left:50%;bottom:max(56px,calc(env(safe-area-inset-bottom) + 48px));transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:9px 11px 9px 16px;border:1px solid #bd914f;border-radius:5px;background:linear-gradient(135deg,#4b0d19ee,#21070fee);box-shadow:0 5px 20px #0009,inset 0 0 0 1px #f2d69a18;color:#f1d49a;white-space:nowrap}
.counterLabel{font-family:"Noto Serif TC","Songti TC",serif;font-size:13px;letter-spacing:.12em}
#count{min-width:2.2em;text-align:center;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:#ffe7b1;text-shadow:0 0 9px #d18b37}
.reset{border:1px solid #b98b4d;border-radius:3px;background:#26070e;color:#e8c98b;padding:7px 10px;font-size:12px;letter-spacing:.08em}
.hint{position:absolute;z-index:6;bottom:max(17px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#e9cfa0;font-size:12px;letter-spacing:.15em;text-shadow:0 2px 8px #000;opacity:.82;pointer-events:none}
#touchGlow{position:absolute;z-index:4;width:100px;height:100px;border-radius:50%;pointer-events:none;opacity:0;transform:translate(-50%,-50%);background:radial-gradient(circle,#f4d39b28,transparent 70%)}

#twelveBlessing{position:absolute;z-index:9;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;
 pointer-events:none;opacity:0;visibility:hidden;background:radial-gradient(ellipse at center,#3b160b55 0%,#17070d22 58%,transparent 78%);
 transition:opacity .45s ease,visibility .45s}
#twelveBlessing.show{visibility:visible;opacity:1}
#twelveBlessing .message{font-family:"Noto Serif TC","Songti TC",serif;font-size:clamp(29px,8vw,46px);font-weight:800;letter-spacing:.13em;line-height:1.55;text-align:center;
 color:#ffe8ad;text-shadow:0 0 8px #f3c76c,0 0 22px #d18a2c,0 4px 18px #210609;opacity:0;transform:scale(.94);
 transition:opacity 1.2s ease,transform 1.2s ease}
#twelveBlessing.show .message{opacity:1;transform:scale(1)}
#twelveBlessing.fade .message{opacity:0;transform:scale(1.05)}
#twelveBlessing .ornament{width:66%;max-width:250px;height:1px;background:linear-gradient(90deg,transparent,#e7c16d,transparent);box-shadow:0 0 9px #d9a84b}
#front.gold-flash{animation:goldPulse .34s ease-in-out infinite alternate}
#rear.gold-flash{animation:goldPulse .34s ease-in-out infinite alternate}
@keyframes goldPulse{from{opacity:.78}to{opacity:1}}


#twelveBlessing .message{white-space:pre-line;max-width:88%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.48}
#buddhaReveal img{object-fit:cover;object-position:center center}
#buddhaReveal{position:absolute;z-index:12;inset:0;display:flex;align-items:center;justify-content:center;
 background:radial-gradient(ellipse at 50% 48%,#ffcf6b55 0%,#3a160bdc 44%,#100307f7 100%);
 opacity:0;visibility:hidden;pointer-events:none;transition:opacity 1.35s ease,visibility 1.35s}
#buddhaReveal.show{opacity:1;visibility:visible}#buddhaReveal.fade{opacity:0}
#buddhaReveal{border:0;outline:0;overflow:hidden}
#buddhaReveal img{display:block;width:100%;height:100%;object-fit:cover;object-position:center center;border:0;outline:0;box-shadow:none;filter:drop-shadow(0 0 22px #ffc75e) drop-shadow(0 0 55px #d98a22)}
#progressGauge{position:absolute;z-index:8;left:8px;top:23%;bottom:24%;width:38px;pointer-events:none;color:#f8d98c;font-family:"Noto Serif TC","Songti TC",serif}
#progressGauge .rail{position:absolute;left:17px;top:5px;bottom:5px;width:3px;border-radius:5px;background:linear-gradient(#8a5b27,#f4d17b,#8a5b27);box-shadow:0 0 7px #d99c3b88}
#progressGauge .fill{position:absolute;left:14px;bottom:5px;width:9px;height:0;border-radius:8px;background:linear-gradient(to top,#b95b0b,#ffd76a,#fff1bd);box-shadow:0 0 9px #ffd66b,0 0 18px #d99b2e;transition:height .35s ease}
#progressGauge .tick{position:absolute;left:0;width:36px;transform:translateY(50%);display:flex;align-items:center;justify-content:space-between;font-size:10px;text-shadow:0 1px 5px #000,0 0 6px #d99b2e}
#progressGauge .tick:after{content:"";width:7px;height:7px;border-radius:50%;background:#f5d58a;box-shadow:0 0 7px #ffc85a}
#progressGauge .tick.top{top:0;transform:none}
#progressGauge .tick.t12{bottom:11.11%}#progressGauge .tick.t18{bottom:16.67%}#progressGauge .tick.t42{bottom:38.89%}#progressGauge .tick.t54{bottom:50%}
#progressGauge .tick.t0{bottom:0;transform:translateY(50%)}

</style>
</head>
<body>
<audio style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none" id="woodPlayer" src="wood.wav" preload="auto" loop playsinline></audio>
<audio style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none" id="bellPlayer" src="bell.mp3" preload="auto" playsinline></audio>
<main id="stage">
 <canvas id="rear"></canvas>
 <img id="hand" src="hand-transparent.png" alt="張開的手掌">
 <canvas id="front"></canvas>
 <div id="touchGlow"></div>
 <div class="banner">祈福護佑 心誠則靈</div>
 <div class="hud"><button id="sound" class="sound" aria-label="切換音效">♫</button></div>
 <div class="counterPanel"><span class="counterLabel">撥珠次數</span><strong id="count">0</strong><button id="reset" class="reset" type="button">重置</button></div>
 <div class="hint">沿著掌心向下撥動佛珠</div>
 <div id="progressGauge" aria-label="撥珠進度">
  <div class="rail"></div><div class="fill" id="gaugeFill"></div>
  <span class="tick top">108</span><span class="tick t54">54</span><span class="tick t42">42</span><span class="tick t18">18</span><span class="tick t12">12</span><span class="tick t0">0</span>
 </div>
 <div id="twelveBlessing" aria-live="polite">
  <div class="ornament"></div>
  <div class="message">十二因緣<br>因果循環<br>知足常樂</div>
  <div class="ornament"></div>
 </div>
 <div id="buddhaReveal" aria-hidden="true">
  <img src="golden-buddha-photo-v15.jpg" alt="金色釋迦牟尼佛像">
 </div>
</main>
<script>
(()=>{
const stage=document.querySelector('#stage'),hand=document.querySelector('#hand');
const rear=document.querySelector('#rear'),front=document.querySelector('#front');
const rc=rear.getContext('2d'),fc=front.getContext('2d');
const glow=document.querySelector('#touchGlow'),soundButton=document.querySelector('#sound');
const countDisplay=document.querySelector('#count'),resetButton=document.querySelector('#reset');
const woodPlayer=document.querySelector('#woodPlayer'),bellPlayer=document.querySelector('#bellPlayer');
let woodStopTimer=null,bellStopTimer=null,bellReady=false;
if(woodPlayer){woodPlayer.preload='auto';woodPlayer.loop=true;woodPlayer.playsInline=true;woodPlayer.volume=.9;}
if(bellPlayer){bellPlayer.preload='auto';bellPlayer.playsInline=true;bellPlayer.volume=1;bellPlayer.addEventListener('canplaythrough',()=>{bellReady=true;},{once:true});}
const blessing=document.querySelector('#twelveBlessing'),buddhaReveal=document.querySelector('#buddhaReveal'),gaugeFill=document.querySelector('#gaugeFill'),beadLayers=[rear,front];
let blessingTimer=null,goldTimer=null,buddhaTimer=null,buddhaFadeTimer=null;
let count=0,gestureMoved=false;
let w=0,h=0,dpr=1,soundOn=true,lastSound=0,active=false,lastY=0,shift=0,frame=0,raf=0;
const COUNT=46,beads=[];
const colors=[
 ['#fff0c9','#d98135','#76200f'],['#ffe0a8','#bd3d1c','#4e0c0a'],
 ['#fff2d7','#df9a48','#9d3918'],['#ffd18a','#e36b1e','#69190e'],
 ['#fff0d0','#b62d1a','#510b0a'],['#ffe4b7','#c76b2b','#76200e']
];
function resize(){
 const r=stage.getBoundingClientRect();w=r.width;h=r.height;dpr=Math.min(devicePixelRatio||1,1.5);
 [rear,front].forEach(c=>{c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);c.style.width=w+'px';c.style.height=h+'px';});
 rc.setTransform(dpr,0,0,dpr,0,0);fc.setTransform(dpr,0,0,dpr,0,0);
 path=makePath();
 buildBeadSprites(Math.max(15,Math.min(29,w*.056)));
 render();
}
window.addEventListener('resize',resize,{passive:true});
window.visualViewport?.addEventListener('resize',resize,{passive:true});
const anchors=[
 [.51,.13],[.65,.15],[.76,.23],[.82,.35],[.83,.49],[.77,.63],
 [.68,.78],[.65,1.08],[.48,1.14],[.34,1.02],[.31,.86],[.37,.70],
 [.46,.55],[.53,.40],[.55,.27]
];
function catmull(t){
 const n=anchors.length,p=t*n,i=Math.floor(p),u=p-i;
 const a=anchors[(i-1+n)%n],b=anchors[i%n],c=anchors[(i+1)%n],d=anchors[(i+2)%n];
 const u2=u*u,u3=u2*u;
 const nx=.5*(2*b[0]+(-a[0]+c[0])*u+(2*a[0]-5*b[0]+4*c[0]-d[0])*u2+(-a[0]+3*b[0]-3*c[0]+d[0])*u3);
 const ny=.5*(2*b[1]+(-a[1]+c[1])*u+(2*a[1]-5*b[1]+4*c[1]-d[1])*u2+(-a[1]+3*b[1]-3*c[1]+d[1])*u3);
 const imageH=w*1448/1086, imageTop=(h-imageH)/2;
 return {x:nx*w,y:imageTop+ny*imageH};
}
let path;
function makePath(){
 const pts=[],steps=1400;let total=0;
 for(let i=0;i<=steps;i++){const p=catmull(i/steps);if(i)total+=Math.hypot(p.x-pts[i-1].x,p.y-pts[i-1].y);pts.push({...p,len:total});}
 return {pts,total};
}
function atDistance(distance){
 const d=((distance%path.total)+path.total)%path.total,pts=path.pts;let lo=0,hi=pts.length-1;
 while(lo<hi){const m=(lo+hi)>>1;if(pts[m].len<d)lo=m+1;else hi=m;}
 const a=pts[Math.max(0,lo-1)],b=pts[lo],q=(d-a.len)/Math.max(.001,b.len-a.len);
 return {x:a.x+(b.x-a.x)*q,y:a.y+(b.y-a.y)*q};
}
for(let i=0;i<COUNT;i++)beads.push({seed:Math.random(),phase:i/COUNT,offset:0,velocity:0,rotation:Math.random()*6.28,spin:0});
let beadSprites=[],spriteSize=0;
function buildBeadSprites(radius){
 beadSprites=[];spriteSize=Math.ceil(radius*2.65);
 const size=spriteSize,center=size/2;
 for(let i=0;i<colors.length;i++){
  const c=colors[i],canvas=document.createElement('canvas');
  canvas.width=Math.ceil(size*dpr);canvas.height=Math.ceil(size*dpr);
  const x=canvas.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);
  const g=x.createRadialGradient(center-radius*.38,center-radius*.48,radius*.04,center+radius*.1,center+radius*.12,radius*1.12);
  g.addColorStop(0,c[0]);g.addColorStop(.28,c[1]);g.addColorStop(.76,c[2]);g.addColorStop(1,'#210807');
  x.save();x.shadowColor='#000c';x.shadowBlur=radius*.30;x.shadowOffsetY=radius*.14;
  x.beginPath();x.arc(center,center,radius,0,Math.PI*2);x.fillStyle=g;x.fill();x.restore();
  x.save();x.beginPath();x.arc(center,center,radius*.92,0,Math.PI*2);x.clip();
  x.translate(center,center);x.globalAlpha=.24;x.strokeStyle=c[0];x.lineWidth=radius*.13;
  x.beginPath();x.ellipse(0,-radius*.13,radius*.72,radius*.28,0,0,Math.PI*2);x.stroke();
  x.beginPath();x.ellipse(0,radius*.17,radius*.85,radius*.22,0,0,Math.PI*2);x.stroke();x.restore();
  const shine=x.createRadialGradient(center-radius*.32,center-radius*.38,0,center-radius*.25,center-radius*.3,radius*.42);
  shine.addColorStop(0,'#fff');shine.addColorStop(.22,'#fff9');shine.addColorStop(1,'#fff0');
  x.beginPath();x.arc(center-radius*.28,center-radius*.34,radius*.22,0,Math.PI*2);x.fillStyle=shine;x.fill();
  beadSprites.push(canvas);
 }
}
function drawBead(ctx,p,r,seed,rotation){
 const sprite=beadSprites[Math.min(colors.length-1,Math.floor(seed*colors.length))];
 if(!sprite)return;
 ctx.save();ctx.translate(p.x,p.y);ctx.rotate(rotation);
 ctx.drawImage(sprite,-spriteSize/2,-spriteSize/2,spriteSize,spriteSize);ctx.restore();
}
function isForeground(t,p){
 // Expand only the right/palm-side foreground mask into the center of the palm.
 // Keep the left finger-side region unchanged so beads there remain occluded by the fingers.
 const palmZone =
   p.x>=w*.555 && p.x<=w*1.04 &&
   p.y>=h*.285 && p.y<=h*.805;
 const leftFingerOcclusion =
   p.x<w*.555 && p.y<h*.63;
 if(leftFingerOcclusion)return false;
 return (t>=.24&&t<=.76)||palmZone;
}
function scheduleRender(){
 if(raf)return;
 raf=requestAnimationFrame(()=>{raf=0;render();});
}
function render(){
 if(!path||!path.total)return;
 rc.clearRect(0,0,w,h);fc.clearRect(0,0,w,h);
 // Continuous dark cord follows the closed loop, split by the same hand-occlusion mask.
 const cordSteps=COUNT*2;
 [rc,fc].forEach((ctx,layerIndex)=>{
  ctx.save();ctx.beginPath();let drawing=false;
  for(let j=0;j<=cordSteps;j++){
   const d=(j/cordSteps)*path.total+shift;
   const p=atDistance(d),t=(((d%path.total)+path.total)%path.total)/path.total;
   const frontLayer=isForeground(t,p);
   if((layerIndex===1)!==frontLayer){drawing=false;continue;}
   if(!drawing){ctx.moveTo(p.x,p.y);drawing=true;}else ctx.lineTo(p.x,p.y);
  }
  ctx.strokeStyle='#160b0b';ctx.lineWidth=Math.max(2.8,w*.008);ctx.lineCap='round';ctx.lineJoin='round';
  ctx.shadowColor='#000';ctx.shadowBlur=3;ctx.stroke();ctx.restore();
 });
 for(let i=0;i<COUNT;i++){
  const bead=beads[i],d=bead.phase*path.total+shift+bead.offset;
  const t=((d%path.total)+path.total)%path.total/path.total;
  const p=atDistance(d),isFront=isForeground(t,p);
  const ctx=isFront?fc:rc,next=atDistance(d+3);
  const angle=Math.atan2(next.y-p.y,next.x-p.x);
  const radius=Math.max(15,Math.min(29,w*.056));
  drawBead(ctx,p,radius,bead.seed,bead.rotation+angle);
 }
}
function startWoodSound(){
 if(!soundOn||!woodPlayer)return;
 clearTimeout(woodStopTimer);
 if(woodPlayer.paused){
  const p=woodPlayer.play();if(p&&p.catch)p.catch(()=>{});
 }
 // Play the bead sound for up to half a second after each movement; new movement refreshes the window.
 woodStopTimer=setTimeout(stopWoodSound,500);
}
function stopWoodSound(){
 clearTimeout(woodStopTimer);woodStopTimer=null;
 if(woodPlayer&&!woodPlayer.paused)woodPlayer.pause();
}
function stopBellSound(){
 clearTimeout(bellStopTimer);bellStopTimer=null;
 if(bellPlayer){bellPlayer.pause();try{bellPlayer.currentTime=0;}catch(_){}}
}
function playTempleBell(){
 if(!soundOn||!bellPlayer)return;
 clearTimeout(bellStopTimer);bellStopTimer=null;
 bellPlayer.pause();
 try{bellPlayer.currentTime=0;}catch(_){}
 bellPlayer.muted=false;bellPlayer.volume=1;
 const playPromise=bellPlayer.play();
 if(playPromise&&typeof playPromise.catch==='function'){
  playPromise.catch(()=>{});
 }
 // Stop exactly three seconds after playback starts; the source MP3 is about 3.65s.
 bellStopTimer=setTimeout(stopBellSound,3000);
}
const milestoneMessages={
 12:['十二因緣','因果循環','知足常樂'].join('\n'),
 18:['六根','六塵','六識','十八界'].join('\n'),
 42:['十住','十行','十回向','十地','等覺','妙覺'].join('\n'),
 54:['十信','十住','十行','十回向','十地','四善根因'].join('\n'),
 108:['破煩惱','滅障報','妙法迴向','功德圓滿'].join('\n')
};
function updateGauge(){
 const cycle=count%108;
 gaugeFill.style.height=(cycle/108*100)+'%';
}
function vibrateMilestone(){
 // Best-effort haptic feedback: supported browsers/devices (typically Android Chrome).
 // iOS Safari currently does not expose navigator.vibrate to ordinary web pages.
 try{if(typeof navigator!=='undefined'&&typeof navigator.vibrate==='function')navigator.vibrate(500);}catch(_){}
}
function triggerMilestone(n){
 const duration=n===108?7:2;
 blessing.querySelector('.message').textContent=milestoneMessages[n];
 blessing.classList.remove('fade');blessing.classList.add('show');
 beadLayers.forEach(layer=>layer.classList.add('gold-flash'));
 playTempleBell();
 clearTimeout(blessingTimer);clearTimeout(goldTimer);clearTimeout(buddhaTimer);clearTimeout(buddhaFadeTimer);
 blessingTimer=setTimeout(()=>{
  blessing.classList.add('fade');
  setTimeout(()=>blessing.classList.remove('show','fade'),1300);
 },n===108?3000:2600);
 goldTimer=setTimeout(()=>beadLayers.forEach(layer=>layer.classList.remove('gold-flash')),duration*1000);
 if(n===108){
  buddhaTimer=setTimeout(()=>{
   buddhaReveal.classList.remove('fade');buddhaReveal.classList.add('show');
   buddhaFadeTimer=setTimeout(()=>buddhaReveal.classList.add('fade'),4000);
   setTimeout(()=>buddhaReveal.classList.remove('show','fade'),5350);
  },3000);
 }
}
function updateWave(delta){
 // Spring response advances only on actual pointer movement; it cannot drift while idle.
 const old=beads.map(b=>b.offset),oldV=beads.map(b=>b.velocity);
 for(let i=0;i<COUNT;i++){
  const b=beads[i],prev=(i+COUNT-1)%COUNT,next=(i+1)%COUNT;
  const dist=Math.min(i,COUNT-i)/COUNT,weight=Math.exp(-dist*7);
  const impulse=delta*.055*weight;
  const spring=((old[prev]+old[next])*.5-old[i])*.20;
  b.velocity=(oldV[i]+impulse+spring)*.56;
  b.offset=old[i]+b.velocity;
  b.rotation+=delta*.0018*(i%2?1:-1);
 }
}
function begin(e){
 if(bellPlayer&&bellPlayer.readyState===0){try{bellPlayer.load();}catch(_){}}
 active=true;gestureMoved=false;lastY=e.clientY;stage.setPointerCapture?.(e.pointerId);
 glow.style.left=e.clientX+'px';glow.style.top=e.clientY+'px';glow.style.opacity='.9';

}
function move(e){
 if(!active)return;
 const dy=e.clientY-lastY;lastY=e.clientY;
 if(Math.abs(dy)<.15)return;
 gestureMoved=true;
 // Positive downward drag advances the front strand down; the return strand rises on the back.
 const delta=dy*1.08;shift+=delta;
 updateWave(delta);
 glow.style.left=e.clientX+'px';glow.style.top=e.clientY+'px';
 startWoodSound();
 scheduleRender();
}
function finish(){
 if(raf){cancelAnimationFrame(raf);raf=0;}
 if(active&&gestureMoved){
  count++;countDisplay.textContent=String(count);updateGauge();
  if([12,18,42,54,108].includes(count))triggerMilestone(count);
  if(count===108){count=0;countDisplay.textContent='0';updateGauge();}
 }
 active=false;
 // Keep the beads exactly where the drag left them; no inertia or idle animation.
 for(const b of beads){b.velocity=0;b.spin=0;}
 glow.style.opacity='0';render();
}
stage.addEventListener('pointerdown',begin);
stage.addEventListener('pointermove',move);
stage.addEventListener('pointerup',finish);
stage.addEventListener('pointercancel',finish);
soundButton.addEventListener('pointerdown',e=>e.stopPropagation());
resetButton.addEventListener('pointerdown',e=>e.stopPropagation());
resetButton.addEventListener('click',()=>{
 count=0;countDisplay.textContent='0';updateGauge();
 clearTimeout(blessingTimer);clearTimeout(goldTimer);clearTimeout(buddhaTimer);clearTimeout(buddhaFadeTimer);
 buddhaReveal.classList.remove('show','fade');blessing.classList.remove('show','fade');beadLayers.forEach(layer=>layer.classList.remove('gold-flash'));
});
soundButton.addEventListener('click',()=>{
 soundOn=!soundOn;soundButton.textContent=soundOn?'♫':'♪';soundButton.style.opacity=soundOn?'1':'.45';
 if(!soundOn){stopWoodSound();stopBellSound();}
});
hand.addEventListener('load',()=>{resize();});
resize();
})();
</script>
</body></html>
